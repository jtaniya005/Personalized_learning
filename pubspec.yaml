name: learn_buddy_app
description: "Learn Buddy — a personalized learning companion for Class 10 & 12 students"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  http: ^1.6.0
  http_parser: ^4.1.2
  speech_to_text: ^7.4.0
  permission_handler: 11.3.1
  image_picker: ^1.2.3
  file_picker: ^11.0.3
  google_mlkit_text_recognition: ^0.16.0
  pdfx: ^2.9.2
  dotted_border: ^3.1.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  google_sign_in: ^6.2.1
  flutter_svg: ^2.0.10+1
  record: ^5.1.2
  audioplayers: ^6.0.0
  flutter_tts: ^4.0.2
  path_provider: ^2.1.3
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FBF7EF"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
