name: learn_buddy_app
description: "Learn Buddy — a personalized learning companion for Class 10 & 12 students"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  http: ^1.6.0
  speech_to_text: ^7.4.0
  permission_handler: 11.3.1
  image_picker: ^1.2.3
  file_picker: ^11.0.3
  google_mlkit_text_recognition: ^0.16.0
  pdfx: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
